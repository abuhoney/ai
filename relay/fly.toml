# Fly.io configuration for Z.AI Relay
# Deploy to Hong Kong region (hkg) to reach internal-api.z.ai

app = "zai-relay"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Environment variables are set via:
#   fly secrets set ZAI_TOKEN=...
#   fly secrets set ZAI_API_KEY=...
#   fly secrets set ZAI_CHAT_ID=...
#   fly secrets set ZAI_USER_ID=...
# (NEVER commit secrets to fly.toml or GitHub)
